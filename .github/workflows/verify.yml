name: Verify
on:
  push:
  pull_request:
jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test src/test/js/*.test.mjs
  java:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: supportops-tests
      MYSQL_PORT: '23306'
      MINIO_PORT: '29000'
      ES_PORT: '29200'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start isolated storage
        run: docker compose up -d --wait --wait-timeout 180
      - name: Verify and package
        run: sh ./mvnw -B -ntp -s .mvn/settings.xml verify
      - name: Validate first startup and six source scenarios
        run: node scripts/evaluate.mjs --sources-only --config=infrastructure/local.env.example
      - name: Capture dependency status on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            target/surefire-reports/
            .local/evaluation/**/report.json
            .local/evaluation/**/review.md
            .local/evaluation/**/application.log
            .local/evaluation/**/runtime.json
            .local/evaluation/**/launcher-error.json
          include-hidden-files: true
      - name: Stop isolated CI storage
        if: always()
        run: docker compose down --volumes --remove-orphans
