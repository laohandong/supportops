name: Verify
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Run the complete regression regardless of changed paths
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      javascript: ${{ steps.scope.outputs.javascript }}
      java: ${{ steps.scope.outputs.java }}
      runtime: ${{ steps.scope.outputs.runtime }}
      automation: ${{ steps.scope.outputs.automation }}
      plan: ${{ steps.scope.outputs.plan }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Determine affected checks
        id: scope
        run: node scripts/ci/changes.mjs
  lightweight:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Check change routing, failure propagation and document links
        run: node --test src/test/ci/*.test.mjs
      - name: Check affected documentation
        env:
          CI_PLAN: ${{ needs.changes.outputs.plan }}
        run: node scripts/ci/docs.mjs
      - name: Validate changed workflow
        if: needs.changes.outputs.automation == 'true'
        shell: bash
        run: |
          tool_dir=$(mktemp -d)
          curl --fail --location --silent --show-error --connect-timeout 10 --max-time 60 https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz -o "$tool_dir/actionlint.tar.gz"
          printf '%s  %s\n' '023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757' "$tool_dir/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$tool_dir/actionlint.tar.gz" -C "$tool_dir" actionlint
          "$tool_dir/actionlint" -shellcheck='' -pyflakes='' .github/workflows/verify.yml
  javascript:
    needs: changes
    if: needs.changes.outputs.javascript == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: node --test src/test/js/*.test.mjs
  java:
    needs: changes
    if: needs.changes.outputs.java == 'true' || needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/reliability-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci
      - run: npm audit --audit-level=high
        if: needs.changes.outputs.runtime == 'true'
      - name: Install pinned Chromium
        if: needs.changes.outputs.runtime == 'true'
        run: npx playwright install --with-deps chromium
      - name: Start isolated storage
        run: node scripts/isolate.mjs --create --directory=.local/ci-storage --fixed-test-ports
      - name: Verify and package
        if: needs.changes.outputs.java == 'true'
        run: sh ./mvnw -B -ntp -s .mvn/settings.xml verify
      - name: Build unchanged Java for runtime validation
        if: needs.changes.outputs.runtime == 'true' && needs.changes.outputs.java != 'true'
        run: sh ./mvnw -B -ntp -s .mvn/settings.xml -DskipTests package
      - name: Package the independently consumable target
        if: needs.changes.outputs.runtime == 'true'
        run: node scripts/package-evaluation-target.mjs --jar target/supportops-0.1.0-SNAPSHOT.jar --output .local/ci-target
      - name: Archive program artifact
        if: needs.changes.outputs.runtime == 'true'
        run: cd .local/ci-target && zip -q ../supportops-target.zip application.jar target.json source-snapshot.json && cd .. && sha256sum supportops-target.zip > supportops-target.zip.sha256
      - uses: actions/upload-artifact@v4
        if: needs.changes.outputs.runtime == 'true'
        with:
          name: supportops-evaluation-target
          path: |
            .local/supportops-target.zip
            .local/supportops-target.zip.sha256
          include-hidden-files: true
      - name: Refuse unregistered resources before cleanup
        if: needs.changes.outputs.runtime == 'true'
        run: node scripts/test-isolation.mjs --deployment=.local/ci-storage/deployment.json --directory=.local/ci-isolation
      - name: Record external dependencies without loading models
        if: needs.changes.outputs.runtime == 'true'
        run: node scripts/test-dependencies.mjs --directory=.local/ci-dependencies
      - name: Runtime, actual browser and fresh restore matrix
        if: needs.changes.outputs.runtime == 'true'
        run: node scripts/test-delivery.mjs --deployment=.local/ci-storage/deployment.json --directory=.local/ci-delivery
      - name: Real index capacity, health response and port compatibility boundaries
        if: needs.changes.outputs.runtime == 'true'
        run: node scripts/test-reliability-boundaries.mjs --directory=.local/ci-boundaries
      - uses: actions/upload-artifact@v4
        if: always() && needs.changes.outputs.runtime == 'true'
        with:
          name: reliability-public-evidence
          path: |
            .local/ci-isolation/public/isolation-report.json
            .local/ci-dependencies/public/dependency-report.json
            .local/ci-delivery/public/*.json
            .local/ci-delivery/browser/public/*.png
            .local/ci-delivery/recovery/public/*.png
            .local/ci-boundaries/public/boundaries-report.json
          include-hidden-files: true
      - name: Stop isolated CI storage
        if: always()
        run: |
          if [ -f .local/ci-storage/deployment.json ]; then
            deployment_id=$(node -e "console.log(require('./.local/ci-storage/deployment.json').deploymentId)")
            node scripts/isolate.mjs --cleanup --deployment=.local/ci-storage/deployment.json --deployment-id="$deployment_id"
          fi
  verify:
    if: always()
    needs: [changes, lightweight, javascript, java]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Require every applicable check to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: >-
          node --input-type=module -e
          "import {assertResults} from './scripts/ci/changes.mjs';
          assertResults(JSON.parse(process.env.CI_NEEDS));
          console.log('All applicable checks passed; unrelated checks were skipped.');"
